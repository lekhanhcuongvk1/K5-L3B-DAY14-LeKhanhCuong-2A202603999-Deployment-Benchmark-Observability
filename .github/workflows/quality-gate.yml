name: Agent quality gate

on:
  pull_request:
  push:
    branches: [main, cuonglk]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 06-lab-complete/benchmark-observability/develop/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Evaluate fixed v2 against the committed baseline
        env:
          AGENT_VERSION: v2
          PORT: "8002"
          MOCK_ERROR_RATE: "0"
          MOCK_SLOW_RATE: "0"
        run: |
          set -euo pipefail
          python app.py > /tmp/day14-agent.log 2>&1 &
          agent_pid=$!
          trap 'kill "$agent_pid" 2>/dev/null || true; wait "$agent_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(100):
              try:
                  with urllib.request.urlopen("http://localhost:8002/health", timeout=1) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("Agent startup timed out")
          PY
          python eval/run_eval.py --url http://localhost:8002 --min-accuracy 1.0 \
            --baseline ../../../reports/eval_v2_fixed.json --out reports/eval_ci.json
