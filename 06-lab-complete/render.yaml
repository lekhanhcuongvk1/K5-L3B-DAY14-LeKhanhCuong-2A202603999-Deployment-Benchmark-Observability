# Blueprint path in the Render dashboard: 06-lab-complete/render.yaml
services:
  - type: web
    name: day14-agent-cuonglk
    runtime: docker
    branch: cuonglk
    region: singapore
    plan: free
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          name: day14-cache-cuonglk
          type: keyvalue
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1"
      - key: MONTHLY_BUDGET_USD
        value: "10"
      - key: LOG_LEVEL
        value: INFO
  - type: keyvalue
    name: day14-cache-cuonglk
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
